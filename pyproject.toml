[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "siglip-embedding-tool"
version = "0.1.0"
description = "Local pretrained SigLIP embeddings and image retrieval, with training references"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.6,<3",
    "transformers>=5.0,<6",
    "huggingface-hub>=0.29,<3",
    "numpy>=1.26,<3",
    "Pillow>=10.4,<14",
    "safetensors>=0.5,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]
translation = [
    "sacremoses>=0.1,<0.2",
    "sentencepiece>=0.2,<0.3",
]

[project.scripts]
siglip-tools = "siglip_tools.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "test_clip_siglip_demo.py"]
markers = ["integration: optional real pretrained model checks using the local HF cache"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
