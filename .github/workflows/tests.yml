name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-tests:
    name: Lint, format, offline tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev,translation]'
      - name: Lint
        run: ruff check src tests training examples
      - name: Format check
        run: ruff format --check tests training examples
      - name: Prepare pinned decoder code (no model weights)
        run: python -m siglip_tools.opus_constraints prepare --output models/opus-constrained-decoder
      - name: Test without pretrained downloads
        run: pytest -m 'not integration'
      - name: CLI smoke
        run: siglip-tools --version && siglip-tools --help >/dev/null
      - name: Check original loss example
        run: python clip_siglip_demo.py
      - name: Build distributions
        run: |
          python -m pip install build
          python -m build --sdist --wheel --outdir dist/
