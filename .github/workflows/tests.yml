name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev,translation]'
      - name: Lint
        run: ruff check src tests training examples
      - name: Test without pretrained downloads
        run: pytest -m 'not integration'
      - name: Check original loss example
        run: python clip_siglip_demo.py
